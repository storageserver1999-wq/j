 <!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#181818" />
    <title>Propeller Engine</title>
  </head>
  <body>
    <main class="workspace">
      <section class="editor" aria-label="3D scene editor">
        <div class="editor-topbar" role="group" aria-label="Scene display tools">
          <div class="view-menu-wrap">
            <button class="view-button" type="button" aria-expanded="false" aria-controls="view-menu">View</button>
            <div id="view-menu" class="view-menu" hidden>
              <button class="render-menu-button" type="button" aria-expanded="false" aria-controls="render-menu">Render <span aria-hidden="true">›</span></button>
              <div id="render-menu" class="render-menu" hidden>
                <button class="grid-toggle-button" type="button" role="switch" aria-checked="true">Hide grid</button>
                <label class="distance-control" for="render-distance">
                  <span>Grid distance</span>
                  <span><output id="render-distance-value">20</output> m</span>
                  <input id="render-distance" type="range" min="0" max="4" step="1" value="2" list="render-distance-steps" />
                  <datalist id="render-distance-steps">
                    <option value="0" label="4"></option>
                    <option value="1" label="10"></option>
                    <option value="2" label="20"></option>
                    <option value="3" label="30"></option>
                    <option value="4" label="40"></option>
                  </datalist>
                </label>
              </div>
            </div>
          </div>
          <div class="feature-menu-wrap">
            <button class="feature-button" type="button" aria-expanded="false" aria-controls="feature-menu">Feature</button>
            <div id="feature-menu" class="feature-menu" hidden>
              <div class="menu-heading">FEATURES</div>
              <div class="lighting-menu-wrap">
                <button class="lighting-button" type="button" aria-expanded="false" aria-controls="lighting-menu">FXlighting <span aria-hidden="true">›</span></button>
                <div id="lighting-menu" class="lighting-menu" hidden>
                  <div class="menu-heading">ADD LIGHT</div>
                  <button type="button" data-light="spot">Spot Light</button>
                  <button type="button" data-light="directional">Universal Light (Sun)</button>
                  <button type="button" data-light="point">Point Light</button>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div class="toolbar" role="group" aria-label="Transform tools">
          <button class="tool-button active" type="button" data-mode="select" aria-pressed="true">Select</button>
          <button class="tool-button tool-icon-button" type="button" data-mode="translate" aria-label="Move" aria-pressed="false" title="Move">
            <img src="./move-icon.png" alt="" aria-hidden="true" />
          </button>
          <button class="tool-button tool-icon-button" type="button" data-mode="rotate" aria-label="Rotate" aria-pressed="false" title="Rotate">
            <img src="./rotate-icon.png" alt="" aria-hidden="true" />
          </button>
          <button class="tool-button tool-icon-button" type="button" data-mode="scale" aria-label="Scale" aria-pressed="false" title="Scale">
            <img src="./scale-icon.png" alt="" aria-hidden="true" />
          </button>
          <button class="add-geometry-point-button" type="button" hidden>Add Point</button>
          <div class="toolbar-spacer" aria-hidden="true"></div>
          <div class="edit-menu-wrap">
            <button class="edit-button" type="button" aria-expanded="false" aria-controls="edit-menu">Rig</button>
            <div id="edit-menu" class="edit-menu" hidden>
              <div class="menu-heading">RIG TOOLS</div>
              <button class="point-geo-button" type="button" aria-pressed="false"><img class="edit-tool-icon" src="./point-geometry.png" alt="" aria-hidden="true" />PointGEO</button>
              <button class="geo-move-button" type="button" aria-pressed="false"><img class="edit-tool-icon" src="./geo-move.png" alt="" aria-hidden="true" />GEOmove</button>
              <button class="eyedropper-button" type="button" aria-pressed="false">Eyedropper</button>
              <button class="snap-button" type="button" aria-pressed="false" title="Toggle grid snapping (Q)">Snap <kbd>Q</kbd></button>
            </div>
          </div>
          <button class="display-mode-button" type="button" data-display-mode="wireframe" aria-label="Wireframe" aria-pressed="false" title="Toggle wireframe for the selected object. Right-click to show all.">
            <img src="./wireframe-icon.png" alt="" aria-hidden="true" />
          </button>
          <button class="display-mode-button" type="button" data-display-mode="faces" aria-label="Faces" aria-pressed="false" title="Show triangle outlines on the selected object. Right-click to show all.">
            <img src="./faces-icon.png" alt="" aria-hidden="true" />
          </button>
        </div>
        <div class="viewport-wrap">
          <div id="viewport" class="viewport" aria-label="3D viewport"></div>
        </div>
        <div class="pbr-dock-resize" role="separator" aria-orientation="horizontal" aria-label="Resize PBR texture panel" aria-valuemin="96" aria-valuemax="420" aria-valuenow="160" tabindex="0"></div>
        <section class="pbr-dock" aria-label="Texture tree">
          <header class="pbr-dock-header">
            <h2>TEXTURE TREE</h2>
            <span>Workspace</span>
          </header>
          <div class="pbr-dock-content">
            <div class="pbr-dock-placeholder">PBR texture workspace</div>
          </div>
        </section>
        <button class="debug-button" type="button" aria-expanded="false" aria-controls="debug-panel" aria-label="Open error log" title="Error log">
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M5 5h6v6H5zM7 2v3M9 2v3M2 7h3M11 7h3M2 10h3M11 10h3M5 11l-2 3M11 11l2 3M5 7V5l2-2h2l2 2v2"/></svg>
        </button>
        <section id="debug-panel" class="debug-panel" aria-label="Runtime errors" hidden>
          <header><strong>Error log</strong><button class="debug-clear" type="button">Clear</button></header>
          <div class="debug-empty">No errors recorded.</div>
          <ol class="debug-entries" aria-live="polite"></ol>
        </section>
      </section>

      <div class="sidebar-resize" role="separator" aria-orientation="vertical" aria-label="Resize scene panels" tabindex="0"></div>
      <aside class="sidebar" aria-label="Scene panels">
        <section class="panel hierarchy-panel">
          <header class="scene-explorer-header">
            <h2>Scene Explorer</h2>
            <div class="scene-explorer-actions">
              <div class="insert-menu-wrap">
                <button class="insert-button" type="button" aria-expanded="false" aria-controls="insert-menu">Shapes</button>
                <div id="insert-menu" class="insert-menu" hidden>
                  <div class="menu-heading">ADD SHAPE</div>
                  <button type="button" data-shape="Cube">Cube</button>
                  <button type="button" data-shape="Sphere">Sphere</button>
                  <button type="button" data-shape="Cylinder">Cylinder</button>
                  <button type="button" data-shape="Cone">Cone</button>
                  <button type="button" data-shape="Torus">Torus</button>
                  <button type="button" data-shape="Pill">Pill</button>
                </div>
              </div>
              <div class="world-insert-wrap">
                <button class="world-insert-button" type="button" aria-expanded="false" aria-controls="world-insert-menu">Insert</button>
                <div id="world-insert-menu" class="world-insert-menu" hidden>
                  <div class="menu-heading">ADD TO WORLD</div>
                  <button class="world-skybox-insert" type="button">World Skybox</button>
                </div>
              </div>
            </div>
          </header>
          <button class="scene-root" type="button" aria-expanded="true" aria-controls="scene-contents">
            <span class="chevron" aria-hidden="true">⌄</span>
            <span>Scene</span>
          </button>
          <div id="scene-contents" class="scene-contents"></div>
        </section>
        <div class="panel-resize" role="separator" aria-orientation="horizontal" aria-label="Resize Hierarchy and Properties panels" tabindex="0"></div>
        <section class="panel properties-panel">
          <h2>Configurations</h2>
          <div class="properties-empty" aria-live="polite">Nothing selected</div>
        </section>
      </aside>
    </main>
    <div id="object-context-menu" class="object-context-menu" role="menu" aria-label="Object actions" hidden>
      <button type="button" role="menuitem" data-action="lock"></button>
      <button type="button" role="menuitem" data-action="group-children">Group child blocks</button>
      <button type="button" role="menuitem" data-action="model-children">Model children into one mesh</button>
      <button type="button" role="menuitem" data-action="show-all-wireframe">Show all objects in wireframe</button>
      <button type="button" role="menuitem" data-action="show-all-faces">Show all object triangle outlines</button>
      <button type="button" role="menuitem" data-action="delete">Delete</button>
    </div>
    <div id="custom-cursor" aria-hidden="true">
      <svg class="propeller-cursor" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <g class="propeller-frame propeller-frame-a">
          <path fill="#171717" d="M6 0h4v6L9 7v2l1 1 5 2 1 2-2 1-5-4-1 1-1 4-2 1-1-2 2-5-1-1-4 1-2-1 1-2 5-1 1-1z"/>
          <path fill="#e6e6e6" d="M7 1h2v5L8 7v2l2 2 4 2v1l-5-3-1 1-1 3H6l2-5-2-2-4 1 1-1 5-1 1-2z"/>
          <path fill="#66c6df" d="M7 1h2v3H7zM13 12l2 1v1l-3-1zM3 8l2-1 1 1-3 1z"/>
        </g>
        <g class="propeller-frame propeller-frame-b">
          <path fill="#171717" d="M2 2h3l4 5 1 1 4-2 2 1-1 2-4 2v2l2 2v1l-4-1-2-5-2-1-3 3-2-1 2-4-2-3 1-2 4 3z"/>
          <path fill="#e6e6e6" d="m3 3 2 1 3 4 2 1 4-2 1 1-4 2v2l2 2-2-1-2-4-2-1-3 3-1-1 2-3-2-3z"/>
          <path fill="#f0c75e" d="m3 3 2 1 2 2-1 1-3-2zM13 8l1-1 1 1-1 1zM4 11l2-2 1 1-2 3-1-1z"/>
        </g>
        <g class="propeller-frame propeller-frame-c">
          <path fill="#171717" d="m7 0 2 1 1 5 1 1 4-1 1 2-3 3v2l2 1-1 2-4-2-2 1-2 1-2-2 3-3V9L2 8 1 6l4-2 1-3z"/>
          <path fill="#e6e6e6" d="m7 1 1 1 1 5 2 1 3-1-2 3v2l2 1-1 1-3-2-3 1 2-3V8L3 7l3-2 1-3z"/>
          <path fill="#f18b66" d="m7 1 1 1v3L7 5 6 3zM13 7l1-1 1 1-2 2zM4 7l3 1v1L4 8z"/>
        </g>
        <path fill="#171717" d="M6 6h4v4H6z"/>
        <path fill="#f3c75f" d="M7 7h2v2H7z"/>
        <path fill="#fff1bd" d="M7 7h1v1H7z"/>
      </svg>
      <img class="propeller-sprite propeller-idle" src="./cursors/propeller-idle.png" alt="" />
      <img class="propeller-sprite propeller-spin-a" src="./cursors/propeller-spin-a.png" alt="" />
      <img class="propeller-sprite propeller-spin-b" src="./cursors/propeller-spin-b.png" alt="" />
      <img class="cursor-hand cursor-hand-click" src="./cursors/hand-click.png" alt="" />
      <img class="cursor-hand cursor-hand-blocked" src="./cursors/hand-blocked.png" alt="" />
      <svg class="eyedropper-cursor" viewBox="0 0 16 16" shape-rendering="crispEdges">
        <path fill="#171717" d="M2 1h4v2h2v2l5 5-2 2-5-5H4V5H2zM8 12l2 2-2 2-2-2z"/>
        <path fill="#f4f4f4" d="M3 2h2v2h2v2l5 5-1 1-5-5H5V5H3zM7 13l1 1-1 1-1-1z"/>
      </svg>
    </div>
    <div id="gpu-error" class="gpu-error" role="alert" hidden></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
